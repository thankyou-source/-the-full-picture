name: Refresh The Full Picture

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Get website files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh public-source data
        run: python scripts/refresh.py

      - name: Save any changes
        run: |
          git config user.name "The Full Picture Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new information"
          else
            git commit -m "Refresh public-source data"
            git push
          fi
